name: Atualizar leis

on:
  schedule:
    - cron: '0 10 * * *'   # todo dia às 6h de Manaus (10h UTC)
  workflow_dispatch:        # permite rodar manualmente pela aba Actions

permissions:
  contents: write

concurrency:
  group: atualizar-leis
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testar o leitor de leis
        run: npm run testar

      - name: Baixar e comparar as leis
        run: npm run atualizar

      - name: Salvar mudanças no repositório
        run: |
          git config user.name "robo-vade-mecum"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Leis atualizadas em $(TZ=America/Manaus date +%d/%m/%Y)"
            git push
          fi
