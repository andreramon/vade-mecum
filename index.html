<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vade Mecum</title>
<meta name="description" content="Legislação brasileira sempre atualizada, com busca rápida e leitura offline.">
<meta name="theme-color" content="#F3F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121816" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#F3F5F2; --sup:#FFFFFF; --tinta:#18211D; --tinta2:#56635C; --linha:#D6DDD8;
  --marca:#F6DC5C; --marca-t:#2E2600; --ouro:#B8902A; --foco:#2E4F9E; --cor:#1F6B4E; --fs:1;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --hl-amarelo:#F8E27A; --hl-verde:#A8E6BC; --hl-azul:#B5D3F7; --hl-rosa:#F7BED6;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-fundo="branco"]{--papel:#FFFFFF;--linha:#DCE1DD}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --papel:#121816; --sup:#1A2220; --tinta:#E4E9E6; --tinta2:#9AA7A0; --linha:#2C3633;
    --marca:#7C6A12; --marca-t:#FFF5C2; --ouro:#D9B54E; --foco:#8FA8F0; --hl-amarelo:rgba(246,220,92,.36); --hl-verde:rgba(120,220,150,.30); --hl-azul:rgba(120,170,245,.36); --hl-rosa:rgba(245,140,185,.34); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --papel:#121816; --sup:#1A2220; --tinta:#E4E9E6; --tinta2:#9AA7A0; --linha:#2C3633;
  --marca:#7C6A12; --marca-t:#FFF5C2; --ouro:#D9B54E; --foco:#8FA8F0; --hl-amarelo:rgba(246,220,92,.36); --hl-verde:rgba(120,220,150,.30); --hl-azul:rgba(120,170,245,.36); --hl-rosa:rgba(245,140,185,.34); color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--foco);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}

/* Cor da lei em tons */
.tinta-lei{color:color-mix(in srgb,var(--cor) 82%,var(--tinta))}
:root[data-theme="dark"] .tinta-lei{color:color-mix(in srgb,var(--cor) 45%,white)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tinta-lei{color:color-mix(in srgb,var(--cor) 45%,white)}}

/* Botões de ícone */
.ico{display:inline-grid;place-items:center;width:44px;height:44px;border:0;border-radius:12px;background:transparent;cursor:pointer;text-decoration:none;flex:none}
.ico:hover{background:color-mix(in srgb,var(--tinta) 7%,transparent)}
.ico svg{width:22px;height:22px}

/* Início */
.topo{display:flex;align-items:center;justify-content:space-between;padding:20px 0 0}
.marca-app{font-family:var(--serif);font-weight:600;font-size:clamp(34px,9vw,44px);line-height:1.05;letter-spacing:-.01em;margin:0}
.verif{margin:6px 0 22px;color:var(--tinta2);font-size:14px}
.campo-busca{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:0 16px;border:1px solid var(--linha);border-radius:16px;background:var(--sup);color:var(--tinta2);cursor:text;text-align:left;font-size:16px}
.campo-busca svg{width:20px;height:20px;flex:none}
.campo-busca input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--tinta);outline:none;padding:14px 0}
.campo-busca:focus-within{border-color:var(--foco)}
.campo-busca.compacto{min-height:44px;border-radius:12px}
.campo-busca.compacto input{padding:10px 0}
.aviso{margin:18px 0 0;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--marca) 35%,var(--sup));color:var(--tinta);font-size:14px}
.secao{font-family:var(--serif);font-weight:600;font-size:22px;margin:34px 0 12px}

/* Estante: cada lei é um livro com lombada */
.estante{display:grid;gap:10px}
.livro{position:relative;display:grid;grid-template-columns:auto 1fr;column-gap:16px;align-items:center;padding:16px 16px 16px 0;border-radius:4px 14px 14px 4px;background:var(--sup);border:1px solid var(--linha);text-decoration:none;overflow:hidden}
.livro:hover{border-color:color-mix(in srgb,var(--cor) 50%,var(--linha))}
.lombada{grid-row:1/span 2;align-self:stretch;width:18px;margin:-16px 0;background:linear-gradient(var(--cor) 12px,var(--ouro) 12px 15px,var(--cor) 15px 19px,var(--ouro) 19px 21px,var(--cor) 21px calc(100% - 21px),var(--ouro) calc(100% - 21px) calc(100% - 19px),var(--cor) calc(100% - 19px) calc(100% - 15px),var(--ouro) calc(100% - 15px) calc(100% - 12px),var(--cor) calc(100% - 12px));
  box-shadow:inset -3px 0 0 rgba(0,0,0,.18)}
.livro-sigla{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.1}
.livro-info{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;color:var(--tinta2);font-size:14px}
.livro-info b{color:var(--tinta);font-weight:500}
.selo{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--marca);color:var(--marca-t);font-size:12.5px;font-weight:600;font-family:var(--sans)}

.lista{list-style:none;margin:0;padding:0;border-top:1px solid var(--linha)}
.lista li{border-bottom:1px solid var(--linha)}
.lista a{display:block;padding:12px 2px;text-decoration:none}
.lista .ref{font-weight:600;font-size:14px}
.lista .trecho{display:block;color:var(--tinta2);font-family:var(--serif);font-size:15px;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vazio{color:var(--tinta2);padding:24px 0}

/* Barra superior do leitor e da busca */
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--papel) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:3px solid var(--cor)}
.barra.neutra{border-bottom:1px solid var(--linha)}
.barra-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:4px;padding:6px 8px}
.barra-tit{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2;padding:0 4px}
.barra-tit strong{font-family:var(--serif);font-size:18px}
.barra-tit span{font-size:12.5px;color:var(--tinta2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Texto da lei */
.texto{font-family:var(--serif);font-size:calc(17px * var(--fs));line-height:1.7;padding-bottom:64px}
.lei-tit{font-family:var(--serif);font-weight:600;font-size:calc(26px * var(--fs));line-height:1.25;margin:28px 0 6px}
.lei-meta{font-family:var(--sans);font-size:14px;color:var(--tinta2);margin:0 0 8px}
.cab{text-align:center;margin:2.4em 0 1em;font-weight:600;font-size:1em;line-height:1.4}
.cab-rot{display:block;font-family:var(--sans);font-size:.72em;letter-spacing:.06em;font-weight:600}
.cab-nome{display:block;margin-top:.15em}
.cab.n0 .cab-nome,.cab.n1 .cab-nome{font-size:1.12em}
.cab.n3,.cab.n4,.cab.n5{margin-top:1.8em}
.cab.n4 .cab-nome,.cab.n5 .cab-nome{font-weight:400;font-style:italic}
.art{margin:0 0 1.4em;padding:2px 0;border-radius:8px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 72px)}
.cab{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 72px)}
.art-cab{display:flex;align-items:center;gap:8px;min-height:36px}
.art-num{font-family:var(--sans);font-weight:600;font-size:.86em;text-decoration:none;padding:2px 0}
.art.recente .art-num{background:var(--marca);color:var(--marca-t);padding:2px 8px;border-radius:4px}
.art-acoes{margin-left:auto;display:flex;gap:2px}
.art-acoes button{width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--tinta2);cursor:pointer;display:grid;place-items:center}
.art-acoes button:hover{background:color-mix(in srgb,var(--tinta) 7%,transparent);color:var(--tinta)}
.art-acoes svg{width:19px;height:19px}
.art-acoes button[aria-pressed="true"]{color:var(--ouro)}
.art-acoes button[aria-pressed="true"] svg{fill:currentColor}
.art p{margin:0 0 .35em}
.disp .rot{font-weight:600}
.disp.inciso{padding-left:1.1em}
.disp.alinea{padding-left:2.2em}
.disp.item{padding-left:3.2em}
.disp.paragrafo{margin-top:.5em}
.nota{display:inline;font-family:var(--sans);font-size:.74em;color:var(--tinta2);margin-left:.35em}
.art.revogado .caput,.disp.revogado{color:var(--tinta2);font-style:italic}
.art.pisca{animation:pisca 1.6s ease-out}
@keyframes pisca{0%,30%{background:color-mix(in srgb,var(--marca) 55%,transparent)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.art.pisca{animation:none;outline:2px solid var(--marca)}}
.lei-fonte{font-family:var(--sans);font-size:13.5px;color:var(--tinta2);border-top:1px solid var(--linha);margin-top:3em;padding-top:1em}

/* Busca */
.contagem{color:var(--tinta2);font-size:14px;margin:18px 0 6px}
.res{display:block;padding:14px 2px;border-bottom:1px solid var(--linha);text-decoration:none}
.res-ref{display:flex;gap:8px;align-items:baseline;font-size:14px;font-weight:600}
.res-ref .sig{font-family:var(--serif)}
.res-txt{display:block;font-family:var(--serif);font-size:16px;line-height:1.55;margin-top:2px}
mark{background:var(--marca);color:var(--marca-t);border-radius:3px;padding:0 1px}
.dicas{color:var(--tinta2);font-size:15px;padding-top:12px}
.dicas p{margin:0 0 8px}
.dicas button{border:1px solid var(--linha);background:var(--sup);border-radius:999px;padding:6px 12px;margin:0 6px 8px 0;cursor:pointer;font-size:14px}

/* Diálogos */
dialog{border:0;padding:0;background:var(--sup);color:var(--tinta);border-radius:20px 20px 0 0;width:100%;max-width:560px;margin:auto auto 0;max-height:82vh;box-shadow:0 -8px 40px rgba(0,0,0,.25)}
@media (min-width:640px){dialog{border-radius:20px;margin:auto}}
dialog::backdrop{background:rgba(10,15,13,.45)}
.dlg-cab{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 6px 20px;position:sticky;top:0;background:var(--sup)}
.dlg-cab h2{font-family:var(--serif);font-size:20px;margin:0}
.dlg-corpo{padding:4px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.indice a{display:block;padding:9px 0;border-bottom:1px solid var(--linha);text-decoration:none;font-size:15px;line-height:1.35}
.indice a small{display:block;color:var(--tinta2);font-size:12px;font-weight:600;letter-spacing:.03em}
.indice .n3{padding-left:14px}.indice .n4,.indice .n5{padding-left:28px}
.ajuste{margin:14px 0 22px}
.ajuste h3{font-size:14px;font-weight:600;margin:0 0 8px;color:var(--tinta2)}
.segmento{display:flex;border:1px solid var(--linha);border-radius:12px;overflow:hidden}
.segmento button{flex:1;min-height:44px;border:0;background:transparent;cursor:pointer}
.segmento button+button{border-left:1px solid var(--linha)}
.segmento button[aria-pressed="true"]{background:var(--tinta);color:var(--papel)}
.fonte-ctrl{display:flex;align-items:center;gap:12px}
.fonte-ctrl button{width:48px;height:44px;border:1px solid var(--linha);border-radius:12px;background:transparent;cursor:pointer;font-family:var(--serif)}
.fonte-ctrl output{flex:1;text-align:center;font-family:var(--serif)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:var(--papel);padding:10px 18px;border-radius:999px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
.hl{color:inherit;padding:0;border-radius:2px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl-amarelo{background:var(--hl-amarelo)}.hl-verde{background:var(--hl-verde)}.hl-azul{background:var(--hl-azul)}.hl-rosa{background:var(--hl-rosa)}
.barra-marca{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);display:flex;align-items:center;gap:6px;padding:7px;border-radius:999px;background:var(--sup);border:1px solid var(--linha);box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:15;transition:transform .2s ease-out;font-family:var(--sans)}
.barra-marca:not(.on){visibility:hidden;transition:transform .2s ease-out,visibility 0s .2s}
.barra-marca.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.barra-marca{transition:none}}
.barra-marca .cor{width:40px;height:40px;border-radius:50%;border:3px solid var(--sup);box-shadow:0 0 0 1px var(--linha);cursor:pointer;padding:0}
.barra-marca .cor[aria-pressed="true"]{box-shadow:0 0 0 2px var(--tinta)}
.barra-marca .sep{width:1px;height:26px;background:var(--linha);margin:0 2px}
.barra-marca .txt-btn{border:0;background:transparent;height:40px;padding:0 12px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:500}
.barra-marca .txt-btn:hover{background:color-mix(in srgb,var(--tinta) 7%,transparent)}
.ponto{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:1px}
.livro.pendente{opacity:.55}
.atalhos{display:grid;gap:8px;margin:16px 0 6px}
.livro.compacto{padding:10px 14px 10px 0;column-gap:14px}
.livro.compacto .lombada{width:12px;margin:-10px 0}
.livro.compacto .livro-sigla{font-size:20px}
.livro .ir{grid-row:1/span 2;grid-column:3;align-self:center;color:var(--tinta2);font-size:14px;font-weight:500;white-space:nowrap}
.livro.compacto{grid-template-columns:auto 1fr auto}
.subtitulo-busca{font-size:13px;font-weight:600;color:var(--tinta2);margin:22px 0 2px;letter-spacing:.02em}
.selo-cinza{display:inline-block;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--tinta) 12%,transparent);color:var(--tinta2);font-size:12.5px;font-weight:600;font-family:var(--sans)}
.continuar{display:flex;align-items:center;gap:14px;margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--sup);border:1px solid var(--linha);border-left:6px solid var(--cor);text-decoration:none}
.continuar .c1,.continuar .c2{display:block}
.continuar .c1{font-size:13px;color:var(--tinta2)}
.continuar .c2{font-family:var(--serif);font-weight:600;font-size:18px}
.continuar svg{margin-left:auto;width:20px;height:20px;transform:rotate(180deg);color:var(--tinta2);flex:none}
/* Anotações */
.nota-pessoal{margin:.7em 0 .2em;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--ouro) 13%,var(--sup));border-left:3px solid var(--ouro);font-family:var(--sans);font-size:.84em;line-height:1.55;white-space:pre-wrap;cursor:pointer}
.np-rot{display:block;font-size:.82em;font-weight:600;color:var(--tinta2);margin-bottom:2px}
dialog textarea{width:100%;min-height:150px;border:1px solid var(--linha);border-radius:12px;padding:12px;background:var(--papel);color:var(--tinta);font:inherit;font-size:16px;line-height:1.5;resize:vertical}
.dlg-sub{margin:0 0 12px;color:var(--tinta2);font-size:14px}
.dlg-botoes{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.btn,.btn-sec{min-height:44px;padding:0 18px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:500}
.btn{border:0;background:var(--tinta);color:var(--papel)}
.btn-sec{border:1px solid var(--linha);background:transparent}
.btn-sec.perigo{color:#B3261E}
:root[data-theme="dark"] .btn-sec.perigo{color:#F2B8B5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-sec.perigo{color:#F2B8B5}}
/* Coleções */
.col-lista{display:grid;gap:6px;margin-bottom:14px}
.col-item{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:6px 12px;border:1px solid var(--linha);border-radius:12px;background:transparent;cursor:pointer;text-align:left}
.col-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--linha);display:grid;place-items:center;flex:none}
.col-check svg{width:15px;height:15px}
.col-item[aria-pressed="true"] .col-check{background:var(--tinta);border-color:var(--tinta);color:var(--papel)}
.col-nome{flex:1;font-weight:500}
.col-qtd{color:var(--tinta2);font-size:14px}
.col-nova{display:flex;gap:8px}
.col-nova input,.col-renomear input{flex:1;min-width:0;min-height:44px;border:1px solid var(--linha);border-radius:12px;padding:0 12px;background:var(--papel);color:var(--tinta);font:inherit;font-size:16px}
.colecoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.colecao{position:relative;display:flex;flex-direction:column;gap:2px;padding:20px 14px 14px;border-radius:4px 14px 14px 14px;background:var(--sup);border:1px solid var(--linha);text-decoration:none;min-height:86px}
.colecao::before{content:"";position:absolute;top:-1px;left:-1px;width:56px;height:8px;border-radius:4px 8px 0 0;background:var(--ouro)}
.c-nome{font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.25}
.c-qtd{color:var(--tinta2);font-size:13.5px;margin-top:auto}
.col-acoes{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.col-renomear{display:flex;gap:8px;margin:0 0 16px}
.col-linha{display:flex;align-items:center;gap:4px}
.col-linha a{flex:1;min-width:0}
.nota-mini{display:block;font-size:13px;color:var(--tinta2);margin-top:2px}
/* Leitura em voz alta */
.player{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);width:min(560px,calc(100% - 20px));display:flex;align-items:center;gap:6px;padding:8px 8px 8px 16px;border-radius:18px;background:var(--tinta);color:var(--papel);box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:14;transition:transform .2s ease-out}
.player:not(.on){visibility:hidden;transition:transform .2s ease-out,visibility 0s .2s}
.player.on{transform:translate(-50%,0)}
@media (max-width:480px){.player{flex-wrap:wrap;justify-content:space-between;padding:10px 8px 4px 16px}.player .player-info{flex-basis:100%;margin-bottom:2px}
body.tocando .texto,body.tocando .wrap{padding-bottom:150px}body.tocando .barra-marca{bottom:calc(128px + env(safe-area-inset-bottom,0px))}body.tocando .toast{bottom:calc(132px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){.player{transition:none}}
.player-info{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.player-tit{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-sub{font-size:12.5px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .ico{width:42px;height:42px;color:var(--papel)}
.player .ico:hover{background:rgba(255,255,255,.12)}
.player .vel{min-width:48px;height:36px;border:1px solid rgba(255,255,255,.35);border-radius:10px;background:transparent;color:var(--papel);font-size:13.5px;font-weight:600;cursor:pointer}
body.tocando .texto,body.tocando .wrap{padding-bottom:110px}
body.tocando .barra-marca{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
body.tocando .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.art.lendo,.col-linha.lendo{background:color-mix(in srgb,var(--foco) 10%,transparent);box-shadow:0 0 0 8px color-mix(in srgb,var(--foco) 10%,transparent)}
/* Lado a lado */
.so-tablet{display:none}
@media (min-width:700px){.so-tablet{display:inline-grid}}
.lado{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--papel);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lado>.barra{position:static}
.lado-paineis{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr}
.painel{display:flex;flex-direction:column;min-height:0;min-width:0;border-left:1px solid var(--linha)}
.painel:first-child{border-left:0}
@media (max-width:699px){.lado-paineis{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.painel{border-left:0;border-top:1px solid var(--linha)}.painel:first-child{border-top:0}}
.painel-cab{display:flex;gap:6px;align-items:center;padding:8px 8px 8px 12px;border-bottom:3px solid var(--cor)}
.painel-cab select,.painel-cab input{height:40px;border:1px solid var(--linha);border-radius:10px;background:var(--sup);color:var(--tinta);font:inherit;font-size:16px;padding:0 8px}
.painel-cab select{flex:1;min-width:0}
.painel-cab input{width:76px}
.painel-rolagem{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.painel .texto{padding-left:18px;padding-right:18px}
.painel .lei-tit{font-size:calc(21px * var(--fs));margin-top:18px}
.painel .art,.painel .cab{scroll-margin-top:12px}
.carregando{color:var(--tinta2);padding-top:40px}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

<dialog id="dlg-indice" aria-labelledby="t-indice">
  <div class="dlg-cab"><h2 id="t-indice">Sumário</h2><button class="ico" data-acao="fechar" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <nav class="dlg-corpo indice" id="lista-indice"></nav>
</dialog>

<dialog id="dlg-ajustes" aria-labelledby="t-ajustes">
  <div class="dlg-cab"><h2 id="t-ajustes">Leitura</h2><button class="ico" data-acao="fechar" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="dlg-corpo">
    <div class="ajuste"><h3>Tema</h3>
      <div class="segmento" role="group" aria-label="Tema">
        <button data-acao="tema" data-valor="auto">Automático</button>
        <button data-acao="tema" data-valor="light">Claro</button>
        <button data-acao="tema" data-valor="dark">Escuro</button>
      </div>
    </div>
    <div class="ajuste"><h3>Fundo no tema claro</h3>
      <div class="segmento" role="group" aria-label="Fundo">
        <button data-acao="fundo" data-valor="papel">Papel</button>
        <button data-acao="fundo" data-valor="branco">Branco</button>
      </div>
    </div>
    <div class="ajuste"><h3>Tamanho do texto</h3>
      <div class="fonte-ctrl">
        <button data-acao="fonte" data-valor="-1" aria-label="Diminuir texto">A−</button>
        <output id="fonte-val">100%</output>
        <button data-acao="fonte" data-valor="1" aria-label="Aumentar texto" style="font-size:20px">A+</button>
      </div>
    </div>
  </div>
</dialog>

<dialog id="dlg-nota" aria-labelledby="t-nota">
  <div class="dlg-cab"><h2 id="t-nota">Anotação</h2><button class="ico" data-acao="fechar" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="dlg-corpo">
    <p class="dlg-sub" id="nota-alvo"></p>
    <label class="sr" for="nota-texto">Texto da anotação</label>
    <textarea id="nota-texto" placeholder="Escreva sua anotação, por exemplo um resumo, uma dica de prova ou a jurisprudência que o professor citou."></textarea>
    <div class="dlg-botoes">
      <button class="btn-sec perigo" data-acao="nota-excluir">Excluir</button>
      <button class="btn" data-acao="nota-salvar">Salvar</button>
    </div>
  </div>
</dialog>

<dialog id="dlg-colecao" aria-labelledby="t-colecao">
  <div class="dlg-cab"><h2 id="t-colecao">Salvar em coleção</h2><button class="ico" data-acao="fechar" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="dlg-corpo">
    <p class="dlg-sub" id="col-alvo"></p>
    <div class="col-lista" id="col-lista"></div>
    <div class="col-nova">
      <label class="sr" for="col-nome">Nome da nova coleção</label>
      <input id="col-nome" maxlength="60" placeholder="Nova coleção, ex.: Tributário – P2" enterkeyhint="done">
      <button class="btn" data-acao="col-criar">Criar</button>
    </div>
  </div>
</dialog>

<div class="player" id="player" role="region" aria-label="Leitura em voz alta"></div>

<div class="toast" id="toast" role="status"></div>

<div class="barra-marca" id="barra-marca" role="toolbar" aria-label="Marcar texto">
  <button class="cor" data-acao="marcar" data-valor="amarelo" style="background:#F8E27A" aria-label="Marcar em amarelo"></button>
  <button class="cor" data-acao="marcar" data-valor="verde" style="background:#A8E6BC" aria-label="Marcar em verde"></button>
  <button class="cor" data-acao="marcar" data-valor="azul" style="background:#B5D3F7" aria-label="Marcar em azul"></button>
  <button class="cor" data-acao="marcar" data-valor="rosa" style="background:#F7BED6" aria-label="Marcar em rosa"></button>
  <span class="sep"></span>
  <button class="txt-btn" data-acao="desmarcar" hidden>Remover</button>
  <button class="txt-btn" data-acao="fechar-marca">Fechar</button>
</div>

  if (E.fundo === 'branco') r.setAttribute('data-fundo', 'branco'); else r.removeAttribute('data-fundo');
  r.style.setProperty('--fs', E.fonte);
  document.querySelectorAll('[data-acao="fundo"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.valor === E.fundo)));
  const out = $('#fonte-val'); if (out) out.textContent = Math.round(E.fonte * 100) + '%';
  document.querySelectorAll('[data-acao="tema"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.valor === E.tema)));
}

/* ---------- Dados ---------- */
async function obterJson(url) {
  const r = await fetch(url, { cache: 'no-cache' });
  if (!r.ok) throw new Error(url + ' ' + r.status);
  return r.json();
}
function rotItem(L, a) { return (L.rotuloItem || 'Art.') + ' ' + a.numero; }
function corpoItem(a) {
  return [a.caput || ''].concat((a.dispositivos || []).map(d => rotuloFmt(d) + ' ' + d.texto)).join('\n');
}
function textoItem(L, a) { return rotItem(L, a) + ' ' + corpoItem(a); }
function prepararLei(l) {
  for (const b of l.blocos) if (b.tipo === 'artigo') { b._corpo = nfc(corpoItem(b)); b._nc = norm(b._corpo); }
  return l;
}
function recente(a) { return !!a.alteradoEm && (Date.now() - new Date(a.alteradoEm + 'T12:00:00')) / 864e5 <= DIAS_RECENTE; }
function maiorNumero(arts) { return arts.reduce((mx, a) => Math.max(mx, parseInt(String(a.numero).replace('.', ''), 10) || 0), 0); }
function faixaItens(l) {
  // Mostra "Art. 1º ao 250" em vez de contar itens: artigos com letra (103-A) e o ADCT
  // fazem a contagem passar do número do último artigo.
  if (!l.ultimo) return l.grupo === 'sumulas' ? plural(l.totalArtigos, 'súmula', 'súmulas') : plural(l.totalArtigos, 'artigo', 'artigos');
  if (l.grupo === 'sumulas') return 'Súmulas 1 a ' + l.ultimo;
  return 'Art. 1º ao ' + l.ultimo + (l.ultimoAdct ? ' + ADCT' : '');
}
function resumoLei(l) {
  const arts = l.blocos.filter(b => b.tipo === 'artigo');
  return { id: l.id, grupo: l.grupo, rotuloItem: l.rotuloItem, sigla: l.sigla, nomeCurto: l.nomeCurto, titulo: l.titulo, cor: l.cor, apelidos: l.apelidos,
    totalArtigos: arts.length, alteracoesRecentes: arts.filter(recente).length,
    ultimo: maiorNumero(arts.filter(a => !a.id.startsWith('adct-'))) };
}
function usarDemo() {
  const d = JSON.parse($('#dados-demo').textContent);
  E.demo = true;
  d.leis.forEach(l => E.leis.set(l.id, prepararLei(l)));
  E.indice = { verificadoEm: d.verificadoEm, leis: d.leis.map(l => ({ ...resumoLei(l), ultimo: 0 })), pendentes: d.pendentes || [] };
}
async function lei(id) {
  if (E.leis.has(id)) return E.leis.get(id);
  const l = prepararLei(await obterJson('data/leis/' + encodeURIComponent(id) + '.json'));
  E.leis.set(id, l);
  return l;
}
const infoLei = id => E.indice.leis.find(l => l.id === id);

function dataLonga(iso) { return iso ? new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' }) : ''; }
function dataCurta(iso) { return iso ? new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' }) : ''; }
function rotuloFmt(d) { return d.tipo === 'inciso' ? d.rotulo + ' –' : d.rotulo; }
function plural(n, um, varios) { return n + ' ' + (n === 1 ? um : varios); }

function txHtml(texto, marcas) {

  let h = '', c = 0;

function telaBusca(q = '') {
  document.title = 'Buscar | Vade Mecum';
  app.innerHTML = `<header class="barra neutra"><div class="barra-in">
      <button class="ico" data-acao="voltar" aria-label="Voltar">${ICO.voltar}</button>

    </div></header>

  const inp = $('#q');
  let t;
  inp.addEventListener('input', () => {
    clearTimeout(t);
    t = setTimeout(() => { history.replaceState(null, '', '#/busca/' + encodeURIComponent(inp.value)); E.pilha[E.pilha.length - 1] = location.hash; executarBusca(inp.value); }, 160);
  });
  inp.addEventListener('keydown', async e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    clearTimeout(t);
    history.replaceState(null, '', '#/busca/' + encodeURIComponent(inp.value)); E.pilha[E.pilha.length - 1] = location.hash;
    await executarBusca(inp.value);

function dicasHtml() {
  const ex = ['ctn', 'código civil', 'cf 5', 'cp art 121', 'stj 7', 'nascituro'];
  return `<div class="dicas"><p>Digite o nome ou a sigla da lei para abrir direto, a sigla com o número para ir ao artigo, ou qualquer palavra do texto.</p>
    ${ex.map(x => `<button data-acao="exemplo" data-valor="${esc(x)}">${esc(x)}</button>`).join('')}</div>`;
}
/* Reconhece leis pelo nome, sigla ou apelido: "ctn", "cf/88", "código civil", "stj" */
const chave = s => norm(s).replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
function acharLeis(texto) {
  const t = chave(texto), tc = t.replace(/ /g, '');
  if (tc.length < 2) return [];
  const achadas = [];
  for (const l of E.indice.leis) {
    const sig = chave(l.sigla).replace(/ /g, '');
    const nomes = [chave(l.nomeCurto), chave(l.titulo || ''), chave(l.apelidos || '')];
    let p = 0;
    if (sig === tc || sig.replace(/\d+$/, '') === tc || nomes[0] === t) p = 3;
    else if (sig.startsWith(tc) || (l.apelidos && chave(l.apelidos).split(' ').includes(t))) p = 2;
    else if (t.length >= 3 && nomes.some(n => (' ' + n + ' ').includes(' ' + t))) p = 1;
    if (p) achadas.push({ l, p });
  }
  return achadas.sort((a, b) => b.p - a.p);
}
async function executarBusca(q) {
  const res = $('#res'); if (!res) return;
  E.irDireto = null;
  const nq = norm(q).trim();
  if (nq.replace(/[^a-z0-9]/g, '').length < 2) { res.innerHTML = dicasHtml(); return; }

  // 1) Atalhos para abrir a lei (aparecem na hora, sem esperar carregar os textos)
  const atalhos = acharLeis(nq).slice(0, 4);
  if (atalhos.length === 1 || (atalhos.length && atalhos[0].p === 3 && atalhos[1].p < 3)) E.irDireto = '#/lei/' + atalhos[0].l.id;
  const termosNota = nq.split(/\s+/).filter(t => t.length > 1);
  const notasAchadas = todasNotas().filter(n => termosNota.every(t => norm(n.texto + ' ' + n.sigla + ' ' + n.rot).includes(t))).slice(0, 10);
  const topo = (atalhos.length ? `<div class="atalhos">${atalhos.map(x => livroHtml(x.l, true)).join('')}</div>` : '')
    + (notasAchadas.length ? `<p class="subtitulo-busca">Nas suas anotações</p><ul class="lista">${notasAchadas.map(n => `<li><a href="#/lei/${esc(n.lei)}/${esc(n.art)}">
      <span class="ref">${esc(n.sigla)}, ${esc(n.rot)}</span><span class="trecho">${esc(n.texto)}</span></a></li>`).join('')}</ul>` : '');

  if (E.leis.size < E.indice.leis.length) {
    res.innerHTML = topo + '<p class="vazio">Preparando a busca nos textos…</p>';
    try { await Promise.all(E.indice.leis.map(l => lei(l.id))); }
    catch (e) { res.innerHTML = topo + '<p class="vazio">Algumas leis não foram carregadas. Confira sua conexão e tente de novo.</p>'; return; }
  }
  if (($('#q') || {}).value !== q) return;

  // 2) Artigos e súmulas
  const r = buscar(q);
  if (r.direto && r.length === 1) E.irDireto = '#/lei/' + r[0].L.id + '/' + r[0].a.id;
  const lista = r.length
    ? `<p class="${atalhos.length ? 'subtitulo-busca' : 'contagem'}">${r.direto ? 'Ir para' : (r.length >= LIMITE ? 'Mais de ' + LIMITE + ' resultados nos textos' : plural(r.length, 'resultado', 'resultados') + ' nos textos')}</p>` + r.map(resultadoHtml).join('')
    : (atalhos.length || notasAchadas.length ? '' : `<p class="vazio">Nada encontrado para “${esc(q)}”. Tente a sigla da lei (ctn, cf, clt), o número do artigo ou outra palavra.</p>`);
  res.innerHTML = r.direto ? lista + topo : topo + lista;
}
function buscar(q) {
  const nq = norm(q).replace(/[º°ª]/g, '').trim();
  const out = [];
  const leis = E.indice.leis.map(i => E.leis.get(i.id)).filter(Boolean);
  const ms = nq.match(/^(sumula\s+vinculante|sv|sumula|sum\.?)\s*(?:n\.?\s*)?(\d{1,4})\b\s*(.*)$/);
  if (ms) {
    const vinc = ms[1] !== 'sumula' && ms[1].replace('.', '') !== 'sum';
    const resto = ms[3].replace(/^d[oa]s?\s+/, '').trim();
    for (const L of leis) {
      if (L.grupo !== 'sumulas') continue;
      if (vinc && L.id !== 'svstf') continue;
      if (resto && !norm(L.sigla + ' ' + (L.apelidos || '') + ' ' + L.nomeCurto).includes(resto)) continue;
      const a = L.blocos.find(b => b.id === 'sum' + ms[2]);
      if (a) out.push({ L, a, termos: [] });
    }
    out.direto = true;
    return out;
  }
  // "<lei> <número>": ctn 150, cf art. 5, cp 121-a, stj 7, código civil 2
  const mn = nq.match(/^(.+?)[\s,]+(?:art(?:igo)?s?\.?\s*|sumula\s*|n\.?\s*)?(\d{1,4}(?:\.\d{3})?)\s*(?:-\s*([a-z]{1,2}))?\.?$/);
  if (mn && !/^(art|artigo|sumula|sv)\.?$/.test(mn[1].trim())) {
    const alvos = acharLeis(mn[1]).filter(x => x.p >= 2);
    for (const { l } of alvos) {
      const L = E.leis.get(l.id); if (!L) continue;
      const id = (L.grupo === 'sumulas' ? 'sum' : 'art') + mn[2].replace('.', '') + (mn[3] && L.grupo !== 'sumulas' ? '-' + mn[3] : '');
      const a = L.blocos.find(b => b.id === id);
      if (a) out.push({ L, a, termos: [] });
    }
    if (out.length) { out.direto = true; return out; }
  }
  const m = nq.match(/^art(?:igo|s)?\.?\s*(\d{1,4}(?:\.\d{3})?)(?:\s*-\s*([a-z]{1,2}))?\b\s*(.*)$/);
  if (m) {
    const id = 'art' + m[1].replace('.', '') + (m[2] ? '-' + m[2] : '');
    const resto = m[3].replace(/^(d[oa]s?|da|do)\s+/, '').trim();
    for (const L of leis) {
      if (L.grupo === 'sumulas') continue;
      if (resto && !norm(L.sigla + ' ' + (L.apelidos || '') + ' ' + L.nomeCurto).includes(resto)) continue;
      const a = L.blocos.find(b => b.id === id);
      if (a) out.push({ L, a, termos: [] });
    }
    out.direto = true;
    if (out.length || !resto) return out;
    out.direto = false;
  }
  const termos = nq.split(/\s+/).filter(t => t.length > 1);
  if (!termos.length) return out;
  for (const L of leis) {
    for (const a of L.blocos) {
      if (a.tipo !== 'artigo' || !termos.every(t => a._nc.includes(t))) continue;
      out.push({ L, a, termos });
      if (out.length >= LIMITE) return out;
    }
  }
  return out;
}
function trechoDestacado(txt, n, termos) {
  if (!termos.length || n.length !== txt.length) return esc(txt.length > 240 ? txt.slice(0, 240) + '…' : txt);
  const pos = n.indexOf(termos[0]);
  let ini = Math.max(0, pos - 70), fim = Math.min(txt.length, pos + 170);
  if (ini > 0) { const e = txt.indexOf(' ', ini); if (e > -1 && e < pos) ini = e + 1; }
  if (fim < txt.length) { const e = txt.lastIndexOf(' ', fim); if (e > pos) fim = e; }
  const faixas = [];
  for (const t of termos) { let i = n.indexOf(t, ini); while (i !== -1 && i < fim) { faixas.push([i, Math.min(i + t.length, fim)]); i = n.indexOf(t, i + t.length); } }
  faixas.sort((x, y) => x[0] - y[0]);
  let html = ini > 0 ? '…' : '', c = ini;
  for (const [a, b] of faixas) { if (a < c) continue; html += esc(txt.slice(c, a)) + '<mark>' + esc(txt.slice(a, b)) + '</mark>'; c = b; }
  return html + esc(txt.slice(c, fim)) + (fim < txt.length ? '…' : '');
}
function resultadoHtml({ L, a, termos }) {
  const corpo = a._corpo, nCorpo = a._nc;
  return `<a class="res" href="#/lei/${esc(L.id)}/${esc(a.id)}" style="--cor:${esc(L.cor)}">
    <span class="res-ref"><span class="sig tinta-lei">${esc(L.sigla)}</span><span>${esc(rotItem(L, a))}</span>${recente(a) ? '<span class="selo">alterado</span>' : ''}</span>
    <span class="res-txt">${trechoDestacado(corpo, nCorpo, termos)}</span></a>`;
}

const M = { pendente: null, ativa: null, timer: 0, calc: 0 };
const barraMarca = $('#barra-marca');
function mostrarBarra(on, edicao = false) {
  barraMarca.classList.toggle('on', on);

  const corAtiva = edicao && M.ativa ? M.ativa.cor : null;

}
function offsetEm(tx, no, off) { const r = document.createRange(); r.selectNodeContents(tx); r.setEnd(no, off); return r.toString().length; }
function lerSelecao() {
  const s = getSelection();
  if (!s.rangeCount || s.isCollapsed) return null;
  const r = s.getRangeAt(0);
  const no = r.commonAncestorContainer;
  const leitor = (no.nodeType === 1 ? no : no.parentElement)?.closest('.leitor');
  if (!leitor) return null;
  M.leitorSel = leitor;
  const segs = [];
  for (const tx of leitor.querySelectorAll('.tx')) {
    if (!r.intersectsNode(tx)) continue;
    const t = tx.textContent;
    let ini = tx.contains(r.startContainer) ? offsetEm(tx, r.startContainer, r.startOffset) : 0;
    let fim = tx.contains(r.endContainer) ? offsetEm(tx, r.endContainer, r.endOffset) : t.length;
    while (ini < fim && /\s/.test(t[ini])) ini++;
    while (fim > ini && /\s/.test(t[fim - 1])) fim--;
    if (fim > ini) segs.push({ art: tx.closest('.art').dataset.id, p: Number(tx.dataset.p), ini, fim, trecho: t.slice(ini, fim) });
  }
  return segs.length ? segs : null;
}
document.addEventListener('selectionchange', () => {
  clearTimeout(M.calc);
  M.calc = setTimeout(() => {
    const segs = lerSelecao();
    if (segs) { clearTimeout(M.timer); M.pendente = segs; M.leitor = M.leitorSel; M.ativa = null; mostrarBarra(true); }
    else if (!M.ativa) {
      // espera um instante: no celular, tocar na barra desfaz a seleção antes do clique
      clearTimeout(M.timer);
      M.timer = setTimeout(() => { M.pendente = null; if (!M.ativa) mostrarBarra(false); }, 450);
    }
  }, 120);
});

function redesenharArtigos(L, ids) {
  for (const leitor of document.querySelectorAll(`.leitor[data-lei="${L.id}"]`)) {
    for (const id of new Set(ids)) {
      const el = leitor.querySelector(`.art[data-id="${id}"]`), a = L.blocos.find(b => b.id === id);
      if (el && a) el.outerHTML = artigoHtml(L, a, leitor.dataset.pref || '');
    }

function fecharMarca() { M.pendente = null; M.ativa = null; mostrarBarra(false); try { getSelection().removeAllRanges(); } catch (e) { } }
function marcar(cor) {
  const L = M.leitor && E.leis.get(M.leitor.dataset.lei); if (!L) return fecharMarca();
  const lista = E.marcas[L.id] || (E.marcas[L.id] = []);
  if (M.ativa) {
    const g = M.ativa.grupo || M.ativa.id;
    const doGrupo = lista.filter(x => (x.grupo || x.id) === g);
    doGrupo.forEach(x => { x.cor = cor; });
    salvarMarcas(); redesenharArtigos(L, doGrupo.map(x => x.art));
    return fecharMarca();
  }
  if (!M.pendente) return fecharMarca();
  const grupo = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  for (const s of M.pendente) {
    // nova marcação substitui as que se sobrepõem no mesmo trecho
    for (let i = lista.length - 1; i >= 0; i--) {
      const x = lista[i];
      if (x.art === s.art && x.p === s.p && x.ini < s.fim && x.fim > s.ini) lista.splice(i, 1);
    }
    const a = L.blocos.find(b => b.id === s.art);
    lista.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), lei: L.id, sigla: L.sigla,
      numero: a.numero, rot: rotItem(L, a), grupo, art: s.art, p: s.p, ini: s.ini, fim: s.fim, trecho: s.trecho, cor, em: Date.now() });
  }
  salvarMarcas();
  redesenharArtigos(L, M.pendente.map(s => s.art));
  fecharMarca();
  toast('Trecho marcado');
}
function desmarcar() {
  const L = M.leitor && E.leis.get(M.leitor.dataset.lei);
  if (L && M.ativa) {
    const lista = E.marcas[L.id] || [];
    const g = M.ativa.grupo || M.ativa.id;
    const removidas = lista.filter(x => (x.grupo || x.id) === g);
    E.marcas[L.id] = lista.filter(x => (x.grupo || x.id) !== g);
    if (removidas.length) { salvarMarcas(); redesenharArtigos(L, removidas.map(x => x.art)); toast('Marcação removida'); }
  }
  fecharMarca();
}

  vozRealcar(false);
  // Já carrega as leis da coleção para a leitura em voz alta começar na hora do toque
  Promise.all([...new Set(c.itens.map(x => x.lei))].map(l => lei(l).catch(() => null)));
}
function removerDaColecao(cid, leiId, art) {
  const c = E.cols.find(x => x.id === cid); if (!c) return;
  c.itens = c.itens.filter(x => !(x.lei === leiId && x.art === art));
  salvarCols(); telaColecao(cid); toast('Removido da coleção');
}
function mostrarRenomear(cid) {
  const c = E.cols.find(x => x.id === cid); if (!c) return;
  $('#area-renomear').innerHTML = `<div class="col-renomear"><label class="sr" for="novo-nome">Novo nome</label>
    <input id="novo-nome" maxlength="60" value="${esc(c.nome)}" enterkeyhint="done" data-col="${esc(cid)}">
    <button class="btn" data-acao="col-renomear-salvar" data-col="${esc(cid)}">Salvar</button></div>`;
  $('#novo-nome').focus();
}
function renomearColecao(cid) {
  const c = E.cols.find(x => x.id === cid), nome = ($('#novo-nome') || {}).value?.trim();
  if (!c || !nome) return;
  c.nome = nome; salvarCols(); telaColecao(cid); toast('Coleção renomeada');
}
function excluirColecao(btn) {
  if (btn.dataset.confirma !== '1') {
    btn.dataset.confirma = '1'; btn.textContent = 'Toque de novo para excluir';
    setTimeout(() => { if (btn.isConnected) { btn.dataset.confirma = ''; btn.textContent = 'Excluir coleção'; } }, 4000);
    return;
  }
  E.cols = E.cols.filter(x => x.id !== btn.dataset.col); salvarCols();
  toast('Coleção excluída'); location.replace('#/');
}

/* ---------- Leitura em voz alta ---------- */
const temVoz = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
const VOZ = { fila: [], i: 0, j: 0, partes: null, ativa: false, pausada: false, vel: guardar.ler('vel', 1), token: 0, voz: null, titulo: '' };
const VELOCIDADES = [1, 1.25, 1.5, 1.75, 0.75];
function escolherVoz() {
  if (VOZ.voz) return VOZ.voz;
  const vs = speechSynthesis.getVoices();
  VOZ.voz = vs.find(v => /pt[-_]BR/i.test(v.lang)) || vs.find(v => /^pt/i.test(v.lang)) || null;
  return VOZ.voz;
}
if (temVoz && speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', () => { VOZ.voz = null; });
function romano(r) {
  const v = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };
  if (!/^[IVXLCDM]+$/.test(r)) return r;
  let n = 0;
  for (let i = 0; i < r.length; i++) { const a = v[r[i]], b = v[r[i + 1]] || 0; n += a < b ? -a : a; }
  return n;
}
function falavel(t) {
  return (t || '').replace(/\bArts\.\s*/g, 'artigos ').replace(/\bArt\.\s*/g, 'artigo ')
    .replace(/§§/g, ' parágrafos ').replace(/§/g, ' parágrafo ').replace(/\bn[º°]\s*/gi, 'número ')
    .replace(/\s[–—]\s/g, ', ').replace(/\s+/g, ' ').trim();
}
function partesDe(L, a) {
  const out = [(L.grupo === 'sumulas' ? rotItem(L, a) : 'Artigo ' + a.numero) + '. ' + falavel(a.caput)];
  for (const d of a.dispositivos || []) {
    let r;
    if (d.tipo === 'inciso') { const [rm, suf] = d.rotulo.split('-'); r = 'Inciso ' + romano(rm) + (suf ? ' ' + suf : ''); }
    else if (d.tipo === 'alinea') r = 'Alínea ' + d.rotulo.replace(')', '');
    else if (d.tipo === 'item') r = 'Item ' + d.rotulo.replace('.', '');
    else r = d.rotulo.replace(/^§\s*/, 'Parágrafo ').replace(/\.$/, '');
    out.push(r + '. ' + falavel(d.texto));
  }
  // Trechos curtos: o Safari às vezes interrompe falas muito longas
  return out.flatMap(t => t.length <= 260 ? [t] : (t.match(/[^.;:]+[.;:]?\s*/g) || [t]).reduce((acc, p) => {
    if (acc.length && (acc[acc.length - 1] + p).length <= 260) acc[acc.length - 1] += p; else acc.push(p);
    return acc;
  }, []));
}
function ouvirAPartirDe(L, a) {
  // Lê do artigo tocado até o fim do capítulo (ou do título, se a lei não tiver capítulos)
  const ini = L.blocos.indexOf(a), fila = [];
  for (let k = ini; k < L.blocos.length && fila.length < 500; k++) {
    const b = L.blocos[k];
    if (b.tipo === 'titulo') { if (b.nivel <= 3) break; continue; }
    fila.push({ lei: L.id, art: b.id });
  }
  vozIniciar(fila, 'até o fim do capítulo');
}
function ouvirColecao(cid) {
  const c = E.cols.find(x => x.id === cid); if (!c) return;
  const fila = c.itens.filter(x => E.leis.has(x.lei)).map(x => ({ lei: x.lei, art: x.art }));
  if (!fila.length) { toast('Carregando as leis, tente de novo em instantes'); return; }
  vozIniciar(fila, c.nome);
}
function vozIniciar(fila, titulo) {
  if (!temVoz) { toast('Este navegador não tem leitura em voz alta'); return; }
  VOZ.token++;
  if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
  Object.assign(VOZ, { fila, i: 0, j: 0, partes: null, ativa: true, pausada: false, titulo });
  document.body.classList.add('tocando');
  vozFalar();
}
function vozFalar() {
  const tk = ++VOZ.token;
  if (!VOZ.ativa) return;
  if (VOZ.i >= VOZ.fila.length) { vozParar(true); return; }
  const it = VOZ.fila[VOZ.i], L = E.leis.get(it.lei), a = L && L.blocos.find(b => b.id === it.art);
  if (!a) { VOZ.i++; VOZ.j = 0; VOZ.partes = null; vozFalar(); return; }
  if (!VOZ.partes) { VOZ.partes = partesDe(L, a); vozRealcar(true); }
  if (VOZ.j >= VOZ.partes.length) { VOZ.i++; VOZ.j = 0; VOZ.partes = null; vozFalar(); return; }
  vozBarra();
  const u = new SpeechSynthesisUtterance(VOZ.partes[VOZ.j]);
  u.lang = 'pt-BR';
  try { const v = escolherVoz(); if (v) u.voice = v; } catch (e) { }
  u.rate = VOZ.vel;
  u.onend = () => { if (tk !== VOZ.token || VOZ.pausada) return; VOZ.j++; vozFalar(); };
  u.onerror = ev => { if (tk !== VOZ.token || ev.error === 'interrupted' || ev.error === 'canceled') return; VOZ.j++; vozFalar(); };
  speechSynthesis.speak(u);
}
function vozCortar() { VOZ.token++; if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel(); }
function vozPausar() { VOZ.pausada = true; vozCortar(); vozBarra(); }
function vozRetomar() { VOZ.pausada = false; vozFalar(); }
function vozPular(d) {
  vozCortar();
  if (d < 0 && VOZ.j > 0) VOZ.j = 0;
  else { VOZ.i = Math.max(0, Math.min(VOZ.fila.length - 1, VOZ.i + d)); VOZ.j = 0; VOZ.partes = null; }
  VOZ.pausada = false; vozFalar();
}
function vozVelocidade() {
  VOZ.vel = VELOCIDADES[(VELOCIDADES.indexOf(VOZ.vel) + 1) % VELOCIDADES.length] || 1;
  guardar.gravar('vel', VOZ.vel);
  if (!VOZ.pausada) { vozCortar(); vozFalar(); } else vozBarra();
}
function vozParar(terminou) {
  vozCortar();
  VOZ.ativa = false; VOZ.fila = []; VOZ.partes = null;
  document.body.classList.remove('tocando');
  $('#player').classList.remove('on');
  document.querySelectorAll('.lendo').forEach(x => x.classList.remove('lendo'));
  if (terminou) toast('Leitura concluída');
}
function vozBarra() {
  const it = VOZ.fila[VOZ.i]; if (!it) return;
  const L = E.leis.get(it.lei), a = L.blocos.find(b => b.id === it.art);
  const p = $('#player');
  p.innerHTML = `<div class="player-info"><span class="player-tit">${esc(L.sigla)}, ${esc(rotItem(L, a))}</span>
      <span class="player-sub">${VOZ.i + 1} de ${VOZ.fila.length}, ${esc(VOZ.titulo)}</span></div>
    <button class="ico" data-acao="voz-ant" aria-label="Voltar">${ICO.ant}</button>
    <button class="ico" data-acao="voz-play" aria-label="${VOZ.pausada ? 'Continuar' : 'Pausar'}">${VOZ.pausada ? ICO.play : ICO.pausa}</button>
    <button class="ico" data-acao="voz-prox" aria-label="Avançar">${ICO.prox}</button>
    <button class="vel" data-acao="voz-vel" aria-label="Velocidade da leitura">${String(VOZ.vel).replace('.', ',')}x</button>
    <button class="ico" data-acao="voz-parar" aria-label="Parar a leitura">${ICO.x}</button>`;
  p.classList.add('on');
}
function vozRealcar(rolar) {
  document.querySelectorAll('.lendo').forEach(x => x.classList.remove('lendo'));
  if (!VOZ.ativa) return;
  const it = VOZ.fila[VOZ.i]; if (!it) return;
  const els = document.querySelectorAll(`.leitor[data-lei="${it.lei}"] .art[data-id="${it.art}"], [data-item="${it.lei}/${it.art}"]`);
  els.forEach(x => x.classList.add('lendo'));
  if (rolar && els[0]) {
    const calmo = matchMedia('(prefers-reduced-motion: reduce)').matches;
    els[0].scrollIntoView({ block: 'center', behavior: calmo ? 'auto' : 'smooth' });
  }
}

/* ---------- Lado a lado ---------- */
function abrirLado(leitor) {
  const atual = leitor ? leitor.dataset.lei : (E.indice.leis[0] || {}).id;
  const outras = E.indice.leis.filter(l => l.id !== atual);
  const outra = (E.ladoOutra && E.ladoOutra !== atual && infoLei(E.ladoOutra)) ? E.ladoOutra : (atual === 'cf88' ? (outras[0] || {}).id : 'cf88');
  location.hash = '#/lado/' + atual + '/' + outra;
}
async function telaLado(a, b) {
  document.title = 'Lado a lado | Vade Mecum';
  app.innerHTML = `<div class="lado"><header class="barra neutra"><div class="barra-in">
      <button class="ico" data-acao="voltar" aria-label="Voltar">${ICO.voltar}</button>
      <div class="barra-tit"><strong>Lado a lado</strong><span>Escolha a lei de cada lado e digite o número para ir ao artigo</span></div>
      <button class="ico" data-acao="ajustes" aria-label="Ajustes de leitura">${ICO.ajustes}</button>
    </div></header>
    <div class="lado-paineis">
      <section class="painel leitor" data-lado="a" data-pref="pa-"></section>
      <section class="painel leitor" data-lado="b" data-pref="pb-"></section>
    </div></div>`;
  await Promise.all([preencherPainel($('.painel[data-lado="a"]'), a), preencherPainel($('.painel[data-lado="b"]'), b)]);
}
async function preencherPainel(sec, id) {
  sec.innerHTML = '<p class="wrap carregando">Abrindo…</p>';
  let L;
  try { L = await lei(id); } catch (e) { sec.innerHTML = '<p class="wrap vazio">Esta lei não pôde ser aberta.</p>'; return; }
  sec.dataset.lei = L.id;
  sec.style.setProperty('--cor', L.cor);
  if (sec.dataset.lado === 'b') E.ladoOutra = L.id;
  const pref = sec.dataset.pref;
  sec.innerHTML = `<div class="painel-cab">
      <select data-painel aria-label="Lei deste lado">${E.indice.leis.map(l => `<option value="${esc(l.id)}"${l.id === L.id ? ' selected' : ''}>${esc(l.sigla)} – ${esc(l.nomeCurto)}</option>`).join('')}</select>
      <input class="painel-art" type="text" inputmode="text" autocomplete="off" placeholder="${L.grupo === 'sumulas' ? 'Nº' : 'Art.'}" aria-label="Número do ${L.grupo === 'sumulas' ? 'enunciado' : 'artigo'}" enterkeyhint="go">
      <button class="ico" data-acao="sumario" aria-label="Sumário">${ICO.sumario}</button>
    </div>
    <div class="painel-rolagem"><div class="wrap texto">
      <h1 class="lei-tit">${esc(L.titulo)}</h1>
      ${L.blocos.map(b => b.tipo === 'artigo' ? artigoHtml(L, b, pref) : cabHtml(b, pref)).join('')}
    </div></div>`;
  vozRealcar(false);
}
document.addEventListener('change', e => {
  const sel = e.target.closest('select[data-painel]'); if (!sel) return;
  const sec = sel.closest('.painel');
  preencherPainel(sec, sel.value).then(() => {
    const ids = [...document.querySelectorAll('.painel')].map(p => p.dataset.lei);
    history.replaceState(null, '', '#/lado/' + ids.join('/'));
    E.pilha[E.pilha.length - 1] = location.hash;
  });
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (t.matches('.painel-art')) {
    e.preventDefault();
    const sec = t.closest('.painel'), L = E.leis.get(sec.dataset.lei);
    const m = norm(t.value).match(/(\d{1,4}(?:\.\d{3})?)\s*(?:[ºo°])?(?:\s*-\s*([a-z]{1,2}))?/);
    if (!L || !m) return;
    const id = (L.grupo === 'sumulas' ? 'sum' : 'art') + m[1].replace('.', '') + (m[2] && L.grupo !== 'sumulas' ? '-' + m[2] : '');
    irPara(id, true, sec); t.blur();
  } else if (t.id === 'col-nome') { e.preventDefault(); criarColecao(); }
  else if (t.id === 'novo-nome') { e.preventDefault(); renomearColecao(t.dataset.col); }
});

/* ---------- Rotas ---------- */
function registrarPilha() {
  const h = location.hash || '#/';
  if (E.pilha.length > 1 && E.pilha[E.pilha.length - 2] === h) E.pilha.pop();
  else if (E.pilha[E.pilha.length - 1] !== h) E.pilha.push(h);
}
function rota() {
  registrarPilha();
  if (M.pendente || M.ativa) fecharMarca();
  const partes = decodeURIComponent(location.hash.slice(1) || '/').split('/').filter(Boolean);
  if (partes[0] === 'lei' && partes[1]) telaLei(partes[1], partes[2]);
  else if (partes[0] === 'lado') telaLado(partes[1] || 'cf88', partes[2] || ((E.indice.leis.find(l => l.id !== (partes[1] || 'cf88')) || {}).id));
  else if (partes[0] === 'colecao' && partes[1]) telaColecao(partes[1]);
  else if (partes[0] === 'busca') { if (!$('#q')) telaBusca(partes.slice(1).join('/')); }
  else { telaInicio(); window.scrollTo(0, 0); }
}

async function iniciar() {
  aplicarPrefs();
  try {
    E.indice = await obterJson('data/indice.json');
    try { E.mudancas = await obterJson('data/mudancas.json'); } catch (e) { }
  } catch (e) { usarDemo(); }
  window.addEventListener('hashchange', rota);
  rota();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
}
iniciar();
</script>
